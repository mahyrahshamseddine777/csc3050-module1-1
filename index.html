<!DOCTYPE html>
<html>
<head>
    <title>Web Application idea</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <header>
        <div class="navbar sticky">
        <nav class="nav-left">
            <b>Spotlight</b>
            <a href="" class="nav-link">Home</a>
            <a href="" class="nav-link">Services</a>
        </nav>
            <!--UPDATE: the search area so it can respond to app.js-->
        <input type="text" placeholder="Search..." class="input-control border"> </nav>
        <div class="search-wrapper">
            <label
                    for="stylist-search"
                    class="sr-only"
            >
            </label>
            <input
                    type="search"
                    id="stylist-search"
                    placeholder="Search stylists or services..."
                    class="input-control border"
                    autocomplete="off"
            >
            <!-- Connecting this to the js.app so it can display the results in a dropdown -->
            <ul
                    id="search-results"
                    class="search-results"
                    hidden
            >
            </ul>
        </div>
            <!-- UPDATE: the log in and register button so it can respond to app.js and asks to log in. -->
        <nav class="nav-right">
            <button
                    type="button"
                    id="login-button"
                    class="btn white rounded-xl border"
            >
                Login
            </button>
                <button
                        type="button"
                        id="register-button"
                        class="btn white rounded-xl border"
                >
                    Register
                </button>
        </nav>
    </div>
    </header>
    <main>
        <section aria-labelledby="welcome-section" class="welcome text-center">
            <h1>Welcome to Spotlight</h1>
        </section>
        <section aria-labelledby="info-section" class="info text-start">
            <div class="">
            <h4>Social media website for stylist</h4>
            <img src="https://www.therapyhairstudio.com/wp-content/uploads/2022/09/choosing-best-professional-hair-stylist-scaled.jpg" class="img-responsive rounded-lg">
            </div>
        </section>
        <section aria-labelledby="more-info-section" class="other-info text-end">
            <div>
            <h4>Grow your business</h4>
            <img src="https://cdn.shopify.com/s/files/1/0013/3536/1603/files/Barber_Cutting_Man_s_Hair-min.jpg?v=1661358566" class="img-responsive rounded-lg">
            </div>
        </section>
    </main>
    <footer>
        <div>
        &copy; Project
        </div>
        <nav>
            <a href="ToS">Terms of Services</a>
        </nav>
            <!--UPDATE: Adding the log in and register form when the user selects and having it connect to app.js-->
    <dialog id="login-dialog">
        <form id="login-form">
            <h2>Login to Spotlight</h2>
            <label for="login-email">
                Email
            </label>
            <input
                    type="email"
                    id="login-email"
                    required
            >
            <label for="login-password">
                Password
            </label>
            <input
                    type="password"
                    id="login-password"
                    required
            >
            <button type="submit">
                Login
            </button>
            <button
                    type="button"
                    id="close-login"
            >
                Cancel
            </button>
        </form>
    </dialog>
    <dialog id="register-dialog">
        <form id="register-form">
            <h2>Create an Account</h2>
            <fieldset>
                <legend>
                    What type of account are you creating?
                </legend>
                <label>
                    <input
                            type="radio"
                            name="account-type"
                            value="customer"
                            checked
                    >
                    Customer
                </label>
                <label>
                    <input
                            type="radio"
                            name="account-type"
                            value="stylist"
                    >
                    Hairstylist
                </label>
            </fieldset>
            <label for="register-name">
                Full Name
            </label>
            <input
                    type="text"
                    id="register-name"
                    required
            >
            <label for="register-email">
                Email
            </label>
            <input
                    type="email"
                    id="register-email"
                    required
            >
            <label for="register-password">
                Password
            </label>

            <input
                    type="password"
                    id="register-password"
                    required
            >
            <label for="confirm-password">
                Confirm Password
            </label>
            <input
                    type="password"
                    id="confirm-password"
                    required
            >
            <!-- Only hairstylists need these fields -->
            <div id="stylist-register-fields" hidden>
                <label for="business-name">
                    Business or Stylist Name
                </label>
                <input
                        type="text"
                        id="business-name"
                >
                <label for="stylist-location">
                    Location
                </label>
                <input
                        type="text"
                        id="stylist-location"
                >
                <label for="stylist-specialties">
                    Specialties
                </label>

                <input
                        type="text"
                        id="stylist-specialties"
                        placeholder="Example: Braids, Natural Hair"
                >
            </div>
            <button type="submit">
                Create Account
            </button>
            <button
                    type="button"
                    id="close-register"
            >
                Cancel
            </button>
        </form>
    </dialog>
</footer>
<!-- Connect JavaScript -->
<script src="js/app.js"></script>
</body>
</html>
